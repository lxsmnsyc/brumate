name: Test

on:
  push:
    branches:
      - main
    # Roadmaps, debates, proposals and decisions are not build inputs.
    paths-ignore:
      - 'docs/**'
  pull_request:
    # A draft runs nothing. Pull requests stay drafts until their review is clean, after the
    # local checks, so CI runs once as the last gate before the merge.
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'

# A new push to a pull request cancels the run of the push before it.
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      # Every live sample of the docs compiles without warnings.
      - run: pnpm --filter website check:samples
      # The plugins of the website, such as the props tables.
      - run: pnpm --filter website test
      # The website builds every page with the packages, so it checks them together.
      - run: pnpm --filter website build
